<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Roses</title>
<meta name="description" content="A bouquet of roses, drawn out of letters.">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; background: #0b0f14; }

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: #c9c3b8;
  overflow: hidden;
}

canvas { display: block; max-width: 100vw; touch-action: pan-y; cursor: grab; }
canvas.drag { cursor: grabbing; }

.back {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  left: 16px;
  z-index: 2;
  color: rgba(244, 241, 234, 0.55);
  font-size: 0.85rem;
  text-decoration: none;
  padding: 8px 4px;
}
.back:hover, .back:focus-visible { color: #f4f1ea; }

.hint {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: rgba(244, 241, 234, 0.3);
  pointer-events: none;
}
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<canvas id="art" role="img" aria-label="A round bouquet of red and pink roses drawn out of letters, slowly turning, with petals falling and the words: for you, sayangg"></canvas>
<p class="hint">drag to turn it &middot; tap to bloom again</p>

<script>
(function () {
  'use strict';

  var W = 88, H = 44;
  var CX = W / 2, CY = 20;
  var R = 16;
  var APEX = [0, -17, 0];
  var MESSAGE = 'for you, sayangg';
  var RAMP = ' .:-=+*#%@';
  var COLS = 2.1;

  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  var PALETTE = [
    [225, 30, 60],   // red
    [200, 20, 50],   // deep red
    [235, 45, 75],   // red
    [255, 110, 160], // pink
    [255, 70, 150],  // hot pink
    [255, 185, 205], // blush
    [255, 120, 110], // coral
    [245, 70, 105]   // rose
  ];

  /* ─── the roses: spread over a dome, golden angle so nothing lines up ─── */
  var N = 34, GOLD = 2.399963;
  var FLOWERS = [];
  for (var i = 0; i < N; i++) {
    var yy = 1 - (i / (N - 1)) * 0.78;        // from the very top down to the shoulder
    var rr = Math.sqrt(1 - yy * yy);
    var th = i * GOLD;
    FLOWERS.push({
      dir: [rr * Math.cos(th), yy, rr * Math.sin(th)],
      ry: 2.5 + rnd() * 1.1,
      rgb: PALETTE[Math.floor(rnd() * PALETTE.length)],
      turns: 3 + Math.floor(rnd() * 3),
      ph: rnd() * 6.28
    });
  }

  /* ─── leaves tucked in between ─── */
  var LEAVES = [];
  var LEAF_CHARS = '~"^;&';
  for (var j = 0; j < 70; j++) {
    var ly = 0.1 + rnd() * 0.9, lr = Math.sqrt(1 - ly * ly), lt = rnd() * 6.28;
    LEAVES.push({
      dir: [lr * Math.cos(lt), ly, lr * Math.sin(lt)],
      ch: LEAF_CHARS.charAt(Math.floor(rnd() * LEAF_CHARS.length)),
      g: 70 + Math.floor(rnd() * 80)
    });
  }

  /* ─── stars and falling petals ─── */
  var STAR_CHARS = ".+*'`";
  var STARS = [];
  for (var s = 0; s < 80; s++) {
    STARS.push({
      x: 1 + Math.floor(rnd() * (W - 2)),
      y: 1 + Math.floor(rnd() * (H - 6)),
      ch: STAR_CHARS.charAt(Math.floor(rnd() * STAR_CHARS.length)),
      ph: rnd() * 6.28
    });
  }

  var PETALS = [];
  var PETAL_CHARS = ',`\'*';
  for (var p = 0; p < 34; p++) {
    PETALS.push({
      x: rnd() * W,
      off: rnd() * (H + 6),
      speed: 2.2 + rnd() * 2.8,
      sway: 2 + rnd() * 5,
      ph: rnd() * 6.28,
      ch: PETAL_CHARS.charAt(Math.floor(rnd() * PETAL_CHARS.length)),
      rgb: PALETTE[Math.floor(rnd() * PALETTE.length)]
    });
  }

  var canvas = document.getElementById('art');
  var ctx = canvas.getContext('2d');
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var fontPx = 12, cellW = 7, cellH = 12, dpr = 1;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var availW = Math.min(window.innerWidth, 1100);
    var availH = window.innerHeight - 40;
    // a monospace character is about 0.6 of its font size wide
    fontPx = Math.min(availW / (W * 0.6), availH / (H * 1.05), 18);
    cellW = fontPx * 0.6;
    cellH = fontPx * 1.05;
    canvas.style.width = Math.floor(cellW * W) + 'px';
    canvas.style.height = Math.floor(cellH * H) + 'px';
    canvas.width = Math.floor(cellW * W * dpr);
    canvas.height = Math.floor(cellH * H * dpr);
  }

  /* ─── turning it around ─── */
  var cosA = 1, sinA = 0, breath = 1;

  function rot(v) {                           // spin about the upright axis
    return [v[0] * cosA + v[2] * sinA, v[1], -v[0] * sinA + v[2] * cosA];
  }

  function proj(v) {                          // a little perspective
    var s = 70 / (70 - v[2]) * breath;
    return { c: CX + v[0] * COLS * s, r: CY - v[1] * s, s: s };
  }

  function put(cv, x, y, ch, rgb) {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < W && y >= 0 && y < H) cv[y * W + x] = { ch: ch, rgb: rgb };
  }

  function drawStem(cv, pt, t) {
    var a = proj(APEX), b = proj(pt);
    var steps = Math.max(Math.abs(b.c - a.c), Math.abs(b.r - a.r), 1) | 0;
    var dx = b.c - a.c, dy = b.r - a.r;
    var ch = Math.abs(dx) < Math.abs(dy) * 0.5 ? '|' : (dx * dy < 0 ? '/' : '\\');
    for (var k = 0; k <= steps; k++) {
      var f = k / steps;
      put(cv, a.c + dx * f, a.r + dy * f, ch, [40, 80 + ((k * 7) % 60), 60]);
    }
  }

  function drawRose(cv, f, pt, nz, grow, t, glow) {
    var q = proj(pt);
    var ry = f.ry * q.s * grow;
    if (ry < 0.6) return;
    var face = Math.abs(nz);
    var rx = ry * COLS * (0.3 + 0.7 * face);  // a rose seen from the side is narrower
    var back = nz < 0;                        // seen from behind: the dull outside of the petals
    var my = Math.floor(ry) + 1, mx = Math.floor(rx) + 1;

    // a soft glow round the roses that face you
    if (glow && !back && grow >= 1) {
      var gy = ry + 1.4, gx = rx + 2.6;
      for (var a = 0; a < 18; a++) {
        var ga = a / 18 * 6.283 + f.ph;
        put(cv, q.c + Math.cos(ga) * gx, q.r + Math.sin(ga) * gy, '.',
          [Math.floor(f.rgb[0] * 0.4), Math.floor(f.rgb[1] * 0.25), Math.floor(f.rgb[2] * 0.3)]);
      }
    }

    // light that slides across the roses as the bouquet turns
    var sweep = 0.5 + 0.5 * Math.sin(t * 1.4 + q.c * 0.06 + f.ph);

    for (var dy = -my; dy <= my; dy++) {
      for (var dx = -mx; dx <= mx; dx++) {
        var u = dx / rx, v = dy / ry;
        var r = Math.sqrt(u * u + v * v);
        var th = Math.atan2(v, u);
        if (r > 0.88 + 0.12 * Math.cos(5 * th)) continue;      // scalloped outline
        var swirl = 0.5 + 0.5 * Math.sin(f.turns * th + 9 * r);
        var shade = (0.25 + 0.75 * swirl) * (1 - 0.45 * r);
        if (r < 0.18) shade = 0.35 + 0.2 * swirl;              // the dark heart
        shade *= 0.85 + 0.3 * sweep;
        if (back) shade *= 0.55;
        var idx = Math.min(RAMP.length - 1, Math.floor(shade * RAMP.length));
        var ch = RAMP.charAt(idx);
        if (ch === ' ') continue;
        var m = 0.35 + shade;
        put(cv, q.c + dx, q.r + dy, ch, [
          Math.min(255, Math.floor(f.rgb[0] * m)),
          Math.min(255, Math.floor(f.rgb[1] * m)),
          Math.min(255, Math.floor(f.rgb[2] * m))
        ]);
      }
    }
  }

  /* ─── one picture ─── */
  function frame(t, angle) {
    cosA = Math.cos(angle); sinA = Math.sin(angle);
    breath = 1 + 0.015 * Math.sin(t * 1.6);   // the bouquet breathes, very slightly

    var cv = new Array(W * H);

    for (var i = 0; i < STARS.length; i++) {  // twinkling stars
      var st = STARS[i];
      var lit = 0.5 + 0.5 * Math.sin(t * 2 + st.ph);
      if (lit > 0.25) {
        var v = Math.floor(90 + 150 * lit);
        put(cv, st.x, st.y, st.ch, [v, v, Math.floor(v * 0.8)]);
      }
    }

    // stems and leaves, under everything else
    var items = [];
    for (var k = 0; k < FLOWERS.length; k++) {
      var f = FLOWERS[k];
      var grow = Math.max(0, Math.min(1, (t - 0.1 * k) / 0.55));
      if (grow <= 0) continue;
      var d = f.dir;
      var pos = rot([d[0] * R, d[1] * R, d[2] * R]);
      var nrm = rot(d);
      drawStem(cv, pos, t);
      items.push({ f: f, pos: pos, nz: nrm[2], grow: grow });
    }
    var leafOn = Math.min(1, t / 1.5);
    for (var l = 0; l < LEAVES.length; l++) {
      if (l / LEAVES.length > leafOn) break;
      var lf = LEAVES[l], ld = lf.dir;
      var lp = rot([ld[0] * R * 0.93, ld[1] * R * 0.93, ld[2] * R * 0.93]);
      var lq = proj(lp);
      put(cv, lq.c, lq.r, lf.ch, [30, lf.g, 55]);
    }

    // roses, the far ones first, so near ones cover them
    items.sort(function (a, b) { return a.pos[2] - b.pos[2]; });
    for (var n = 0; n < items.length; n++) {
      var it = items[n];
      drawRose(cv, it.f, it.pos, it.nz, it.grow, t, true);
    }

    // a glint that flickers on the front roses
    for (var g = 0; g < items.length; g++) {
      var gi = items[g];
      if (gi.nz > 0.35 && gi.grow >= 1 && Math.sin(t * 3 + gi.f.ph * 5) > 0.93) {
        var gq = proj(gi.pos);
        put(cv, gq.c + 2, gq.r - 1, '*', [255, 245, 235]);
        put(cv, gq.c + 1, gq.r - 1, '+', [255, 200, 210]);
        put(cv, gq.c + 3, gq.r - 1, '+', [255, 200, 210]);
      }
    }

    // petals drifting down, in front of everything
    if (t > 1.2) {
      for (var q = 0; q < PETALS.length; q++) {
        var pe = PETALS[q];
        var py = ((t - 1.2) * pe.speed + pe.off) % (H + 6) - 3;
        var px = pe.x + Math.sin(t * 0.9 + pe.ph) * pe.sway;
        put(cv, px, py, pe.ch, pe.rgb);
      }
    }

    // the words, once everything has bloomed
    if (t > FLOWERS.length * 0.1 + 0.6) {
      var start = (W >> 1) - (MESSAGE.length >> 1);
      var fade = Math.min(1, (t - (FLOWERS.length * 0.1 + 0.6)) / 1.2);
      for (var c = 0; c < MESSAGE.length; c++) {
        put(cv, start + c, H - 2, MESSAGE.charAt(c),
          [Math.floor(255 * fade), Math.floor(190 * fade), Math.floor(200 * fade)]);
      }
    }
    return cv;
  }

  function paint(cv) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b0f14';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.font = fontPx + 'px "Courier New", Consolas, monospace';
    ctx.textBaseline = 'top';
    var last = '';
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var cell = cv[y * W + x];
        if (!cell) continue;
        var fill = 'rgb(' + cell.rgb[0] + ',' + cell.rgb[1] + ',' + cell.rgb[2] + ')';
        if (fill !== last) { ctx.fillStyle = fill; last = fill; }
        ctx.fillText(cell.ch, x * cellW, y * cellH);
      }
    }
  }

  /* ─── the show ─── */
  var startedAt = 0, raf = 0, lastDraw = 0;
  var drag = 0;                               // how far the person has turned it by hand
  var SPIN = 0.5;                             // radians a second once it is blooming

  function angleAt(t) {
    // it starts turning once the first roses are open, easing in so it does not jerk
    var e = Math.max(0, t - 1.5);
    var turned = e < 2 ? e * e / 4 : e - 1;   // speeds up for two seconds, then steady
    return SPIN * turned + drag;
  }

  function tick(now) {
    var t = (now - startedAt) / 1000;
    if (now - lastDraw > 33) {                // about 30 frames a second is plenty
      paint(frame(t, angleAt(t)));
      lastDraw = now;
    }
    raf = requestAnimationFrame(tick);
  }

  function still() { paint(frame(20, 0.4 + drag)); }

  function play() {
    cancelAnimationFrame(raf);
    size();
    drag = 0;
    if (REDUCED) { still(); return; }         // one finished picture, no motion
    startedAt = performance.now();
    raf = requestAnimationFrame(tick);
  }

  /* drag to turn it by hand, tap to start again */
  var down = false, moved = 0, lastX = 0;
  canvas.addEventListener('pointerdown', function (e) {
    down = true; moved = 0; lastX = e.clientX;
    canvas.classList.add('drag');
    try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    moved += Math.abs(dx);
    drag += dx * 0.012;
    if (REDUCED) still();
  });
  function release() {
    if (!down) return;
    down = false;
    canvas.classList.remove('drag');
    if (moved < 6) play();                    // a tap, not a drag
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', function () { down = false; canvas.classList.remove('drag'); });

  window.addEventListener('resize', function () { size(); if (REDUCED) still(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancelAnimationFrame(raf);
    else if (!REDUCED) raf = requestAnimationFrame(tick);
  });

  play();
})();
</script>
</body>
</html>
