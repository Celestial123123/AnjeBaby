<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE VAULT</title>
<meta name="description" content="Every stream and every clip.">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

:root {
  --black:   #08080a;
  --panel:   #0e0e11;
  --panel-2: #141418;
  --edge:    #1e1e24;
  /* Hers, and what the page falls back to if the script never runs. */
  --accent:      #ff1b2d;        /* text and thin marks, on the black */
  --accent-dim:  #8f1018;
  --accent-fill: #d81426;        /* blocks that carry text on top */
  --accent-lift: #f01a2e;        /* those blocks, hovered */
  --accent-glow: rgba(255, 27, 45, 0.22);
  --on-accent:   #ffffff;        /* whatever contrasts with the fill */
  --ink:     #f2f2f4;
  --ink-mid: #9a9aa4;
  --ink-low: #5c5c66;
  --ink-date:#8a8a94;           /* the date, lifted so it is actually readable */
  --cut:     10px;              /* the clipped corner, used everywhere */
  --swap:    0.35s;             /* every accent colour crossfades together at this */
  --swap-ease: cubic-bezier(0.4, 0, 0.2, 1);   /* eases out, so it settles rather than stops */
}

/* The cycle button writes data-who onto the html element, and these redefine
   the accent tokens under it, so one press repaints the title, the bars, the
   tags, the ticks, the pills and the buttons together.

   Each theme is measured to the same contrast as the others: the marks sit at
   roughly 5.2 against the black, and whatever sits on a filled block is picked
   to contrast with it. That is white on the red and the blue, but dark on the
   green, because white on a green that bright reads at under 2 to 1.

   The three sit evenly round the wheel, red at 355 degrees, green at 112 and
   blue at 217, so no two of them blur together on a small screen. */
[data-who="all"] {
  --accent:      #2d981c;
  --accent-dim:  #1a5c10;
  --accent-fill: #44d62c;
  --accent-lift: #53e03a;
  --accent-glow: rgba(68, 214, 44, 0.22);
  --on-accent:   #08080a;
}

[data-who="his"] {
  --accent:      #3b82f6;
  --accent-dim:  #1e3a8a;
  --accent-fill: #2563eb;
  --accent-lift: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.22);
  --on-accent:   #ffffff;
}

html { background: var(--black); }

body {
  font-family: 'Chakra Petch', system-ui, sans-serif;
  background:
    radial-gradient(circle at 50% -5%, rgba(255, 27, 45, 0.1) 0%, transparent 42%),
    var(--black);
  color: var(--ink);
  min-height: 100svh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* faint horizontal lines over everything, like a screen */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.016) 0 1px,
    transparent 1px 3px
  );
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: clamp(40px, 8vh, 68px) clamp(14px, 4vw, 26px) clamp(50px, 10vh, 84px);
}

/* the colour can change under them, so these ease rather than jump */
h1 span,
.eyebrow,
.eyebrow::after,
.section-label::before,
.when::before,
.flag {
  transition: color var(--swap) var(--swap-ease), background var(--swap) var(--swap-ease);
}

/* ═══════════════ Header ═══════════════ */
.head { margin-bottom: clamp(24px, 5vw, 34px); }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--accent-dim), transparent);
}

h1 {
  margin-top: 10px;
  font-size: clamp(2.6rem, 12vw, 5rem);
  font-weight: 700;
  line-height: 0.92;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
h1 span { color: var(--accent); }

.sub {
  margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.72rem, 2.4vw, 0.82rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-date);
}

/* ═══════════════ Filters ═══════════════
   One row. The type sits on the left, and who it belongs to is a single
   button on the right that cycles Everyone, His, Hers. */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: clamp(22px, 5vw, 32px);
}
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }

.tab {
  padding: 9px 18px;
  border: 1px solid var(--edge);
  background: var(--panel);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mid);
  cursor: pointer;
  transition: color var(--swap) var(--swap-ease), background var(--swap) var(--swap-ease), border-color var(--swap) var(--swap-ease);
}
.tab:hover { color: var(--ink); border-color: var(--accent-dim); }
.tab[aria-pressed="true"] {
  background: var(--accent-fill);
  border-color: var(--accent-fill);
  color: var(--on-accent);
}
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  margin-left: 7px;
  opacity: 0.7;
}

/* the one that cycles, pushed to the far end with a mark to say it turns */
.cycle { margin-left: auto; }
.cycle::after {
  content: '↻';
  margin-left: 9px;
  font-size: 0.86rem;
  line-height: 1;
  opacity: 0.55;
}
/* The row needs about 459px of content to hold all four. Below roughly 500px
   of viewport it cannot, so rather than leave the button stranded at the end
   of a wrapped line it takes the whole second row, which also makes it a far
   better target for a thumb. */
@media (max-width: 520px) {
  .filterbar { justify-content: center; }
  .cycle {
    margin-left: 0;
    flex: 1 1 100%;
  }
}

/* ═══════════════ Sections ═══════════════ */
.section + .section { margin-top: clamp(28px, 6vw, 42px); }

.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
}
.section-label::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--accent);
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--edge);
}
.section-label .n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--ink-low);
}

/* ═══════════════ Grid ═══════════════ */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.item {
  display: block;
  position: relative;
  text-decoration: none;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--edge);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  /* the lift on hover keeps its own timing, it is not a theme colour */
  transition: border-color var(--swap) var(--swap-ease), background var(--swap) var(--swap-ease), transform 0.2s;
}
.item:hover {
  background: var(--panel-2);
  border-color: var(--accent);
  transform: translateY(-2px);
}
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.thumb { position: relative; background: #000; overflow: hidden; }
.thumb img {
  display: block;
  position: relative;
  z-index: 1;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  filter: saturate(0.92) contrast(1.04);
  transition: filter 0.25s, transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.item:hover .thumb img { filter: none; transform: scale(1.035); }

/* ── A phone shaped thumbnail in a widescreen slot ──
   Cropping a 9:16 clip to 16:9 throws away two thirds of the frame, so the
   whole thing is shown instead and a blown up blurred copy of itself fills
   the space either side. The grid stays even and nothing is lost. The class
   is added by script once the image reports its real shape, so it works for
   anything portrait without being declared per entry. */
.thumb.portrait img { object-fit: contain; }
.item:hover .thumb.portrait img { transform: none; }

.backdrop {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(22px) saturate(1.3) brightness(0.55);
  transform: scale(1.25);          /* hides the soft edge the blur leaves */
  pointer-events: none;
}

/* a wash across the bottom of every thumbnail */
.thumb::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  z-index: 2;
  height: 54%;
  background: linear-gradient(to top, rgba(8,8,10,0.9), transparent);
  pointer-events: none;
}

/* while it is actually streaming, the dot breathes */
.flag.now::before { animation: pulse 1.7s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* where it opens, mirroring the duration on the other corner */
.site {
  position: absolute;
  left: 0; bottom: 0;
  z-index: 3;
  padding: 3px 8px;
  background: var(--black);
  border-right: 1px solid var(--edge);
  border-top: 1px solid var(--edge);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.64rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mid);
}

.len {
  position: absolute;
  right: 0; bottom: 0;
  z-index: 3;
  padding: 3px 8px;
  background: var(--black);
  border-left: 1px solid var(--edge);
  border-top: 1px solid var(--edge);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.flag {
  position: absolute;
  left: 0; top: 0;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 9px;
  background: var(--accent-fill);
  clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on-accent);
}
.flag::before {
  content: '';
  width: 5px; height: 5px;
  background: var(--on-accent);
}

.meta {
  padding: 12px 14px 14px;
  border-top: 1px solid var(--edge);
}
/* the date on the left, when she last opened it on the right */
.metarow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  margin-top: 5px;
}

.seen {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-low);
}

/* the newest thing in here, sat opposite the duration */
.fresh {
  position: absolute;
  right: 0; top: 0;
  z-index: 3;
  padding: 4px 9px;
  background: var(--accent-fill);
  clip-path: polygon(9px 0, 100% 0, 100% 100%, 0 100%);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on-accent);
  transition: background var(--swap) var(--swap-ease), color var(--swap) var(--swap-ease);
}

.title {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.when {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.02em;
  color: var(--ink-date);
}
/* a red marker rather than red text, so the LIVE tag keeps the loud colour */
.when::before {
  content: '';
  flex: none;
  width: 2px;
  height: 0.78em;
  background: var(--accent);
}

.empty {
  padding: 34px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--ink-low);
}

/* ═══════════════ Footer ═══════════════ */
.foot {
  margin-top: clamp(32px, 7vw, 50px);
  padding-top: 18px;
  border-top: 1px solid var(--edge);
  text-align: center;
}
.back {
  display: inline-block;
  padding: 9px 22px;
  border: 1px solid var(--accent-fill);
  background: var(--accent-fill);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--on-accent);
  text-decoration: none;
  transition: background var(--swap) var(--swap-ease), border-color var(--swap) var(--swap-ease), box-shadow var(--swap) var(--swap-ease);
}
.back:hover {
  background: var(--accent-lift);
  border-color: var(--accent-lift);
  box-shadow: 0 0 18px var(--accent-glow);
}
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .flag.now::before { animation-duration: 4s; }

  /* A colour crossfade is not motion, nothing travels and nothing scales, so
     the theme still eases between its colours. What stops is the things that
     actually move: the card lifting and the thumbnail zooming. */
  .item:hover { transform: none; }
  .item:hover .thumb img { transform: none; }
  .item { transition-property: border-color, background; }
  .thumb img { transition-property: filter; }
}
</style>
</head>
<body>

<main class="wrap">

  <header class="head">
    <p class="eyebrow">Streams &amp; Clips</p>
    <h1>The <span>Vault</span></h1>
    <p class="sub">Access granted // all of it is yours</p>
  </header>

  <div class="filterbar">
    <div class="tabs" id="kindFilters"></div>
    <button class="tab cycle" type="button" id="ownerCycle" aria-pressed="false" title="Whose videos to show" hidden></button>
  </div>

  <div id="shelf"></div>

  <footer class="foot">
    <a class="back" href="index.html">&larr; Hub</a>
  </footer>

</main>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   The list.

   To add a YouTube one: copy a line, change the id, title, seconds
   and the timestamp. The id is the bit after youtu.be/ or ?v= in the
   link. The thumbnail comes from the id on its own.

   Anywhere else, TikTok and so on, add two more fields: url, the full
   link to open, and thumb, a picture saved in thumbs/. Save it rather
   than hotlinking, because those addresses are signed and expire.
   A portrait picture is handled on its own, nothing to declare.

   While something is actually streaming, give it secs: 0 and a
   liveUntil timestamp. The card says LIVE NOW until that moment
   passes and then goes quiet by itself, so nothing here can be left
   claiming to be live days later. Fill in the real seconds afterwards.
   ═══════════════════════════════════════════════════════════════ */
var MY_LIVES = [
  { id: 'Smqa9KPXxB8', title: 'Diamond today?', secs: 12248, at: '2026-10-05T06:01:43+00:00' },
  { id: 'NyGOx_R7gGs', title: 'Solo Ranked', secs: 8379, at: '2026-10-03T23:29:41-07:00' },
  { id: 'AIglxR_-hkw', title: 'Meow',        secs: 2776, at: '2026-10-02T02:19:26-07:00' }
];

var MY_CLIPS = [
  { id: 'OfBAznpGEGI', title: 'Sunflower',   secs: 156, at: '2026-10-04T04:43:47-07:00' },
  { id: 'gQL3D-khtv4', title: 'Wild Flower', secs: 216, at: '2026-10-01T14:24:46-07:00' },
  { id: 'xBOBqQIgoxE', title: 'MVP',         secs: 110, at: '2026-06-23T07:05:39-07:00' },
  { id: 'DGBOqMM7edE', title: 'Kiss Me',     secs: 195, at: '2026-06-22T10:32:54-07:00' }
];

/* Hers. While both of these are empty the His and Hers buttons stay hidden
   and the headings read just Lives and Clips, so the page looks finished
   rather than half built. Adding one line here turns all of it on. */
var HER_LIVES = [];

var HER_CLIPS = [
  { id: '7655199251974098183', title: 'Still Learning', secs: 32, at: '2026-06-25T13:22:58+08:00',
    url: 'https://www.tiktok.com/@ehxkenal/video/7655199251974098183',
    thumb: 'thumbs/tiktok-7655199251974098183.jpg' }
];

var $ = function (s) { return document.querySelector(s); };

function two(n) { return n < 10 ? '0' + n : '' + n; }

function clock(s) {
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  return h ? h + ':' + two(m) + ':' + two(sec) : m + ':' + two(sec);
}

/* the timestamps carry their own offset, so this prints the day in her time */
function when(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  try {
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
  } catch (e) {
    return two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear();
  }
}

/* What she has opened, kept on her own device. It never leaves her phone and
   it tells me nothing, it is only so she can see what she has already been
   through. Any failure here is silent and the page carries on without it. */
var SEEN_KEY = 'vault-seen';

function seenAll() {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }
  catch (e) { return {}; }
}

function markSeen(id) {
  try {
    var all = seenAll();
    all[id] = Date.now();
    localStorage.setItem(SEEN_KEY, JSON.stringify(all));
  } catch (e) {}
}

/* Within the week it counts days, after that it just gives the date, because
   "seen 43 days ago" is not something anybody can picture. */
function seenWording(stamp) {
  if (!stamp) return '';
  var then = new Date(stamp);
  if (isNaN(then)) return '';

  var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  var days = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);

  if (days <= 0) return 'Seen today';
  if (days === 1) return 'Seen yesterday';
  if (days <= 6) return 'Seen ' + days + ' days ago';
  return 'Seen ' + when(stamp);
}

/* Named from the address rather than a field on the entry, so adding a clip
   from somewhere new needs nothing here until it deserves a nicer name. */
function siteOf(v) {
  if (!v.url) return 'YouTube';
  var host = (v.url.match(/^https?:\/\/([^/]+)/i) || [])[1] || '';
  host = host.toLowerCase().replace(/^www\./, '');
  // anchored to the domain, so a lookalike host cannot borrow the name
  if (/(^|\.)tiktok\.com$/.test(host)) return 'TikTok';
  if (/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) return 'YouTube';
  if (/(^|\.)instagram\.com$/.test(host)) return 'Instagram';
  if (/(^|\.)twitch\.tv$/.test(host)) return 'Twitch';
  return host.split('.')[0];
}

/* True only while her own clock is still before the moment the entry says the
   stream should be over. Nothing here can keep claiming to be live once that
   passes, which matters on a page nobody is around to update. */
function liveNow(v) {
  if (!v.liveUntil) return false;
  var until = new Date(v.liveUntil);
  return !isNaN(until) && Date.now() < until.getTime();
}

function card(v, isLive, isNewest) {
  var a = document.createElement('a');
  a.className = 'item';
  a.href = v.url || ('https://youtu.be/' + v.id);   // the app picks this up on its own
  a.target = '_blank';
  a.rel = 'noopener';

  var thumb = document.createElement('div');
  thumb.className = 'thumb';

  var img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = v.title;
  /* A picture that is taller than it is wide gets the blurred backdrop, so
     the whole frame can be shown without breaking the row. Cached images are
     already loaded by the time this runs, hence the complete check. */
  function shape() {
    if (!img.naturalWidth || img.naturalHeight <= img.naturalWidth) return;
    thumb.classList.add('portrait');
    var bd = document.createElement('div');
    bd.className = 'backdrop';
    bd.style.backgroundImage = 'url("' + img.src + '")';
    thumb.insertBefore(bd, img);
  }
  img.addEventListener('load', shape);

  if (v.thumb) {
    img.src = v.thumb;
  } else {
    // the big one is cleanly 16:9; older uploads sometimes only have the small one
    img.onerror = function () {
      img.onerror = null;
      img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
    };
    img.src = 'https://i.ytimg.com/vi/' + v.id + '/maxresdefault.jpg';
  }
  if (img.complete) shape();

  thumb.appendChild(img);

  var onAir = liveNow(v);

  if (isLive) {
    var flag = document.createElement('span');
    flag.className = onAir ? 'flag now' : 'flag';
    flag.textContent = onAir ? 'Live now' : 'Live';
    thumb.appendChild(flag);

    /* The check above happens once, so a page left open on her desk would keep
       saying LIVE NOW after the stream had finished. This stands the tag down
       at the moment it expires. The upper bound keeps a far off date from
       asking the browser for an absurd timer. */
    if (onAir) {
      var left = new Date(v.liveUntil).getTime() - Date.now();
      if (left > 0 && left < 86400000) {
        setTimeout(function () {
          flag.className = 'flag';
          flag.textContent = 'Live';
        }, left + 1000);
      }
    }
  }

  if (isNewest && !onAir) {
    var fresh = document.createElement('span');
    fresh.className = 'fresh';
    fresh.textContent = 'New';
    thumb.appendChild(fresh);
  }

  var site = document.createElement('span');
  site.className = 'site';
  site.textContent = siteOf(v);
  thumb.appendChild(site);

  if (v.secs > 0) {
    var len = document.createElement('span');
    len.className = 'len';
    len.textContent = clock(v.secs);
    thumb.appendChild(len);
  }

  var meta = document.createElement('div');
  meta.className = 'meta';

  var t = document.createElement('p');
  t.className = 'title';
  t.textContent = v.title;

  var row = document.createElement('div');
  row.className = 'metarow';

  var w = document.createElement('p');
  w.className = 'when';
  w.textContent = when(v.at);

  var seen = document.createElement('p');
  seen.className = 'seen';
  seen.textContent = seenWording(seenAll()[v.id]);

  row.appendChild(w);
  row.appendChild(seen);

  // opening it counts as watching it, and the line updates without a reload
  a.addEventListener('click', function () {
    markSeen(v.id);
    seen.textContent = 'Seen today';
  });

  meta.appendChild(t);
  meta.appendChild(row);
  a.appendChild(thumb);
  a.appendChild(meta);
  return a;
}

(function () {
  // newest first, whatever order they were typed in
  function sorted(list) {
    return list.slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
  }

  /* The most recent thing in the vault, whoever it belongs to and whichever
     kind it is. Only one entry ever carries the tag. */
  var newestId = (function () {
    var best = null;
    [MY_LIVES, MY_CLIPS, HER_LIVES, HER_CLIPS].forEach(function (list) {
      list.forEach(function (v) {
        if (!best || new Date(v.at) > new Date(best.at)) best = v;
      });
    });
    return best ? best.id : null;
  })();

  function fill(grid, list, isLive) {
    if (!list.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'NOTHING HERE YET';
      grid.appendChild(p);
      return;
    }
    sorted(list).forEach(function (v) {
      grid.appendChild(card(v, isLive, v.id === newestId));
    });
  }

  /* Four shelves. Whether hers exist at all decides how the page presents
     itself, so nothing has to be switched on by hand later. */
  var hasHers = (HER_LIVES.length + HER_CLIPS.length) > 0;

  var SHELVES = [
    { owner: 'his',  kind: 'lives', items: MY_LIVES,  name: hasHers ? 'His Lives' : 'Lives' },
    { owner: 'his',  kind: 'clips', items: MY_CLIPS,  name: hasHers ? 'His Clips' : 'Clips' },
    { owner: 'hers', kind: 'lives', items: HER_LIVES, name: 'Her Lives' },
    { owner: 'hers', kind: 'clips', items: HER_CLIPS, name: 'Her Clips' }
  ];

  /* Built once. The filters only hide, so nothing is rebuilt and the
     thumbnails never reload when she taps about. */
  var shelf = $('#shelf');

  SHELVES.forEach(function (s) {
    if (!s.items.length) return;            // an empty shelf is never drawn

    var sec = document.createElement('section');
    sec.className = 'section';

    var h = document.createElement('h2');
    h.className = 'section-label';
    h.appendChild(document.createTextNode(s.name + ' '));

    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = s.items.length;
    h.appendChild(n);

    var grid = document.createElement('div');
    grid.className = 'grid';
    fill(grid, s.items, s.kind === 'lives');

    sec.appendChild(h);
    sec.appendChild(grid);
    shelf.appendChild(sec);
    s.el = sec;
  });

  function count(owner, kind) {
    return SHELVES.reduce(function (total, s) {
      var ok = (owner === 'all' || s.owner === owner) && (kind === 'all' || s.kind === kind);
      return ok ? total + s.items.length : total;
    }, 0);
  }

  function pills(box, key, options, onPick) {
    options.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'tab';
      b.type = 'button';
      b.setAttribute('data-' + key, o.value);
      b.appendChild(document.createTextNode(o.label + ' '));

      var n = document.createElement('span');
      n.className = 'n';
      b.appendChild(n);
      o.badge = n;
      o.el = b;

      b.addEventListener('click', function () { onPick(o.value); });
      box.appendChild(b);
    });
  }

  var kind = 'all';

  var kindOpts = [
    { value: 'all',   label: 'All'   },
    { value: 'lives', label: 'Lives' },
    { value: 'clips', label: 'Clips' }
  ];

  /* Who it belongs to is one button rather than a second row. Each press moves
     to the next of these and wraps round. */
  var OWNERS = [
    { value: 'all',  label: 'Everyone' },
    { value: 'his',  label: 'His'      },
    { value: 'hers', label: 'Hers'     }
  ];
  var at = 0;
  function owner() { return OWNERS[at].value; }

  var cycle = $('#ownerCycle');
  var cycleName = document.createTextNode('');
  var cycleBadge = document.createElement('span');
  cycleBadge.className = 'n';
  cycle.appendChild(cycleName);
  cycle.appendChild(cycleBadge);

  function apply() {
    var who = owner();

    SHELVES.forEach(function (s) {
      if (!s.el) return;
      s.el.hidden = !((who  === 'all' || s.owner === who) &&
                      (kind === 'all' || s.kind  === kind));
    });

    kindOpts.forEach(function (o) {
      o.badge.textContent = count(who, o.value);
      o.el.setAttribute('aria-pressed', o.value === kind ? 'true' : 'false');
    });

    /* this one attribute repaints the page, because every accent on it reads
       from the tokens that [data-who] redefines */
    document.documentElement.setAttribute('data-who', who);

    cycleName.nodeValue = OWNERS[at].label + ' ';
    cycleBadge.textContent = count(who, kind);
    cycle.setAttribute('aria-pressed', who === 'all' ? 'false' : 'true');
    cycle.setAttribute('aria-label', 'Showing ' + OWNERS[at].label + '. Press to change.');
  }

  pills($('#kindFilters'), 'kind', kindOpts, function (v) { kind = v; apply(); });

  cycle.addEventListener('click', function () {
    at = (at + 1) % OWNERS.length;
    apply();
  });

  // the button only makes sense once there is something of hers
  cycle.hidden = !hasHers;

  apply();
})();
</script>
